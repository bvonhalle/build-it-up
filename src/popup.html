<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <h1 class="wordmark"><svg class="sigil" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <rect x="2.5" y="3.2" width="5" height="2.7" rx="1.35" fill="var(--c-source)"/>
        <rect x="2.5" y="6.9" width="8" height="2.7" rx="1.35" fill="var(--c-medium)"/>
        <rect x="2.5" y="10.6" width="11" height="2.7" rx="1.35" fill="var(--c-campaign)"/>
      </svg>Build it up</h1>
    <button id="openOptions" class="icon-btn" title="Edit your naming conventions" aria-label="Edit your naming conventions">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path d="M8 10.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M13 8a5 5 0 0 0-.1-1l1.3-1-1.5-2.6-1.5.6a5 5 0 0 0-1.7-1L9.2 1.4H6.8L6.5 3a5 5 0 0 0-1.7 1l-1.5-.6L1.8 6l1.3 1a5 5 0 0 0 0 2l-1.3 1 1.5 2.6 1.5-.6a5 5 0 0 0 1.7 1l.3 1.6h2.4l.3-1.6a5 5 0 0 0 1.7-1l1.5.6 1.5-2.6-1.3-1a5 5 0 0 0 .1-1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="pane">
    <div class="field">
      <label for="dest">Destination</label>
      <input id="dest" type="text" spellcheck="false" placeholder="https://yoursite.com/page">
    </div>

    <div class="row">
      <div class="field" data-key="source">
        <label for="f-source">Source <span class="req" aria-hidden="true">•</span></label>
        <input id="f-source" list="l-source" class="tax" data-key="source" spellcheck="false" placeholder="google" autocomplete="off">
        <datalist id="l-source"></datalist>
      </div>
      <div class="field" data-key="medium">
        <label for="f-medium">Medium <span class="req" aria-hidden="true">•</span></label>
        <input id="f-medium" list="l-medium" class="tax" data-key="medium" spellcheck="false" placeholder="cpc" autocomplete="off">
        <datalist id="l-medium"></datalist>
      </div>
    </div>

    <div class="field" data-key="campaign">
      <label for="f-campaign">Campaign <span class="req" aria-hidden="true">•</span></label>
      <input id="f-campaign" list="l-campaign" class="tax" data-key="campaign" spellcheck="false" placeholder="spring-sale-2026" autocomplete="off">
      <datalist id="l-campaign"></datalist>
    </div>

    <details class="more">
      <summary>Term and content</summary>
      <div class="row">
        <div class="field" data-key="term">
          <label for="f-term">Term</label>
          <input id="f-term" list="l-term" class="tax" data-key="term" spellcheck="false" placeholder="keyword" autocomplete="off">
          <datalist id="l-term"></datalist>
        </div>
        <div class="field" data-key="content">
          <label for="f-content">Content</label>
          <input id="f-content" list="l-content" class="tax" data-key="content" spellcheck="false" placeholder="hero-cta" autocomplete="off">
          <datalist id="l-content"></datalist>
        </div>
      </div>
    </details>
  </main>

    <div id="prompt" class="prompt" role="status" aria-live="polite" hidden>
    <span id="promptText" class="prompt-text"></span>
    <button id="promptAccept" class="prompt-accept" type="button"></button>
    <button id="promptDismiss" class="prompt-dismiss" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <section class="preview" aria-live="polite">
    <div class="preview-head">
      <span class="eyebrow">Link</span>
      <span id="fixNote" class="fix-note" hidden></span>
    </div>
    <output id="out" class="url"></output>
  </section>

  <footer class="actions">
    <button id="copy" class="primary" disabled>Copy link</button>
    <button id="reset" class="ghost" title="Clear all fields">Clear</button>
  </footer>

  <details class="recent">
    <summary>Recent links <span id="recentCount" class="count"></span></summary>
    <ul id="recentList" class="recent-list"></ul>
  </details>

  <script src="normalize.js"></script>
  <script src="similar.js"></script>
  <script src="popup.js"></script>
</body>
</html>
